<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Fulton County – 3D City</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #bfd8ef; font-family: sans-serif; }
    #status { position: fixed; top: 10px; left: 10px; padding: 6px 10px; background: rgba(0,0,0,.6);
              color: #fff; border-radius: 4px; font-size: 13px; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<div id="status">Loading…</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// ▼▼ Put the names of your converted .glb files here ▼▼
// open  localhost:8000/?glb=cleveland.glb  to view any single file
const fromUrl = new URLSearchParams(location.search).get('glb');
const TILES = fromUrl ? [fromUrl] : [
  'Georgia-13121-000.glb', 'Georgia-13121-001.glb',
  'Georgia-13121-002.glb', 'Georgia-13121-003.glb',
  'Georgia-13121-004.glb', 'Georgia-13121-005.glb',
  'Georgia-13121-006.glb', 'Georgia-13121-007.glb',
];

const status = document.getElementById('status');

// --- renderer / scene / camera ---
const renderer = new THREE.WebGLRenderer({ antialias: true, logarithmicDepthBuffer: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xbfd8ef);
scene.fog = new THREE.Fog(0xbfd8ef, 4000, 20000);

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 1, 100000);
camera.position.set(800, 600, 800);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2 - 0.02; // don't go under the ground

// --- lights ---
scene.add(new THREE.HemisphereLight(0xffffff, 0x556677, 1.3));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(1, 2, 0.6);
scene.add(sun);

// --- ground (buildings sit at y = 0) ---
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(200000, 200000),
  new THREE.MeshStandardMaterial({ color: 0x7a8a6a })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);

// --- buildings ---
const buildingMat = new THREE.MeshStandardMaterial({ color: 0xdedad2, flatShading: true, side: THREE.DoubleSide });
const cityBounds = new THREE.Box3();
const loader = new GLTFLoader();
let loaded = 0;

function frameCity() {
  const center = cityBounds.getCenter(new THREE.Vector3());
  const size = cityBounds.getSize(new THREE.Vector3());
  const radius = Math.max(size.x, size.z) * 0.6 + 200;
  controls.target.set(center.x, 0, center.z);
  camera.position.set(center.x + radius * 0.6, radius * 0.6, center.z + radius * 0.6);
  scene.fog.near = radius * 2;   // fog scales with the city so it never hides it
  scene.fog.far = radius * 6;
  camera.far = radius * 10;
  camera.updateProjectionMatrix();
  controls.maxDistance = radius * 3;
  controls.update();
  console.log('city size (m):', size.x.toFixed(0), 'x', size.z.toFixed(0), 'tallest:', size.y.toFixed(0));
}

for (const url of TILES) {
  loader.load(
    url,
    (gltf) => {
      gltf.scene.traverse((o) => { if (o.isMesh) o.material = buildingMat; });
      scene.add(gltf.scene);
      cityBounds.expandByObject(gltf.scene);
      loaded++;
      status.textContent = `Loaded ${loaded}/${TILES.length} tiles`;
      if (loaded === 1) frameCity();          // jump to the first tile right away
      if (loaded === TILES.length) { frameCity(); setTimeout(() => status.remove(), 2000); }
    },
    undefined,
    (err) => { console.warn('missing tile (fine if not converted yet):', url, err); }
  );
}

// --- name tags (curation helper): loads <name>_labels.json made by osm_skyline.py; press L to toggle ---
const labelRenderer = new CSS2DRenderer();
labelRenderer.setSize(innerWidth, innerHeight);
Object.assign(labelRenderer.domElement.style, { position: 'fixed', top: '0', left: '0', pointerEvents: 'none' });
document.body.appendChild(labelRenderer.domElement);
const labelGroup = new THREE.Group();
scene.add(labelGroup);
if (fromUrl) {
  fetch(fromUrl.replace(/\.glb$/, '_labels.json'))
    .then((r) => (r.ok ? r.json() : []))
    .then((labels) => {
      for (const L of labels) {
        const div = document.createElement('div');
        div.innerHTML = `<b>${L.text}</b><br><span style="opacity:.75">${L.latlon}</span>`;
        Object.assign(div.style, { background: 'rgba(0,0,0,.7)', color: '#fff', padding: '2px 6px',
          borderRadius: '4px', font: '12px sans-serif', whiteSpace: 'nowrap', textAlign: 'center' });
        const tag = new CSS2DObject(div);
        tag.position.set(L.x, L.y + 8, L.z);
        tag.center.set(0.5, 1);
        labelGroup.add(tag);
      }
    })
    .catch(() => {});
}
addEventListener('keydown', (e) => { if (e.key === 'l' || e.key === 'L') labelGroup.visible = !labelGroup.visible; });

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  labelRenderer.setSize(innerWidth, innerHeight);
});

renderer.setAnimationLoop(() => {
  controls.update();
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
});
</script>
</body>
</html>
